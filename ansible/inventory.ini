# Matches the ssh config aliases (~/.ssh/config), so `ssh k3s-worker1` and
# an Ansible run reach the same host the same way.
#
# 300 control: 2 vCPU, 5GiB RAM  — control plane only, no Longhorn replicas
# 301 worker1: 8 vCPU, 12GiB RAM — every workload, plus vdb for Longhorn

[k3s_servers]
k3s-control ansible_host=192.168.1.10

[k3s_agents]
k3s-worker1 ansible_host=192.168.1.11

# Nodes that actually hold Longhorn replicas. Control is excluded at the
# Longhorn level (allowScheduling: false, ADR 005), so the iSCSI shutdown
# ordering only matters here.
[longhorn_nodes]
k3s-worker1

[k3s_nodes:children]
k3s_servers
k3s_agents

[k3s_nodes:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519_k3s
ansible_python_interpreter=/usr/bin/python3
