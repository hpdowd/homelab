[defaults]
inventory = inventory.ini
host_key_checking = True
# Node config is low-frequency and high-consequence, so always run with
# --diff. The `yaml` stdout callback that used to be set here was removed
# from ansible-core (it lives in community.general now) and made every run
# fail outright; not worth a collection dependency for prettier output.
# No fact caching: two hosts, and stale facts on a storage node are worse
# than the second it costs to gather them.
gathering = smart

[ssh_connection]
pipelining = True
