---
# journald defaults to 10% of the filesystem. On the worker that is ~4GiB of
# a 41GiB OS disk already carrying 24GiB of container images, and it had
# grown to 531MiB unnoticed before the 2026-07-26 review.
#
# A drop-in rather than an edit to journald.conf: idempotent, greppable, and
# it wins over the main file if a hand-edit is still lying around.

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-size-cap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/common). Do not edit by hand.
      [Journal]
      SystemMaxUse={{ journald_max_use }}
  notify: Restart systemd-journald

# The cap was first applied on 2026-07-26 by appending a [Journal] block to
# journald.conf itself. The drop-in above supersedes it, so the setting was
# correct either way — but two sources of truth for one value is precisely
# the drift this layer exists to remove, and the next person to raise the
# cap would edit one and not the other. No-op once the block is gone.
- name: Remove the hand-added journald cap superseded by the drop-in
  ansible.builtin.replace:
    path: /etc/systemd/journald.conf
    regexp: '\n+\[Journal\]\nSystemMaxUse={{ journald_max_use }}\s*\Z'
    replace: "\n"
  notify: Restart systemd-journald
