---
# k3s flags currently exist only in the systemd unit that the original
# `curl | sh` generated. Reinstall k3s with a different command line and
# they are silently gone — there is no record of them anywhere in the repo.
#
# k3s reads /etc/rancher/k3s/config.yaml on every start and the installer
# does not overwrite it, so moving flags here makes them survive a
# reinstall. Writing the file changes nothing until k3s restarts, which is
# why no handler restarts it: that is a deliberate maintenance-window
# action, not a side effect of an Ansible run.

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (roles/k3s_node). Do not edit by hand.
      # Takes effect on the next k3s restart — see the role for why nothing
      # here restarts it for you.
      node-ip: {{ ansible_host }}
      disable:
        - traefik
        - servicelb
      write-kubeconfig-mode: "0644"
      # local-path writes here. A server flag, so it is cluster-wide even
      # though the disk pressure it solves is the worker's — see the variable
      # for what that means for control, which has no vdb. Existing PVs keep
      # the path recorded in their own spec.local.path; this only affects
      # PVs created from here on.
      default-local-storage-path: {{ k3s_local_storage_path }}
  when: inventory_hostname in groups['k3s_servers']

- name: Write k3s agent config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (roles/k3s_node). Do not edit by hand.
      node-ip: {{ ansible_host }}
  when: inventory_hostname in groups['k3s_agents']

# k3s passes the kubelet --config-dir pointing here and writes only its own
# 00-k3s-defaults.conf, so a later file overrides it field by field. That
# file sets shutdownGracePeriod: 0s, which must stay 0: the kubelet rejects
# it combined with the by-priority list. Same rule as config.yaml above,
# nothing applies until k3s restarts.
#
# On a rebuild this runs before k3s is installed, so the directory does not
# exist yet. k3s reuses it.
- name: Ensure kubelet config drop-in directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    owner: root
    group: root
    mode: "0700"   # what k3s creates it with

- name: Write kubelet graceful-shutdown config
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-graceful-shutdown.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/k3s_node). Do not edit by hand.
      # Why the priorities and the numbers: k3s_shutdown_grace_by_priority
      # in group_vars/all.yml.
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      shutdownGracePeriodByPodPriority:
      {% for g in k3s_shutdown_grace_by_priority %}
        - priority: {{ g.priority }}
          shutdownGracePeriodSeconds: {{ g.seconds }}
      {% endfor %}

# Cheap guard against the class of drift that started all this: a setting
# that is right in the repo and wrong on the box, with nothing comparing
# them. Reports only, never changes anything.
- name: Read effective journald cap
  ansible.builtin.command: systemd-analyze cat-config systemd/journald.conf
  register: journald_effective
  changed_when: false
  check_mode: false

- name: Assert journald cap is actually in effect
  # Skipped under --check: the drop-in above has not been written, so this
  # would report drift that the same run is in the middle of fixing. It
  # fails the play (serial: 1) before the second node is ever reached.
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: "'SystemMaxUse=' + journald_max_use in journald_effective.stdout"
    fail_msg: >-
      journald cap not in effect ({{ journald_max_use }} expected). A
      hand-edit in journald.conf may be overriding the drop-in.
    success_msg: "journald capped at {{ journald_max_use }}"
