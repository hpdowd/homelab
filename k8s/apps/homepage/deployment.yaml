# gethomepage/homepage — one stateless container that renders a link grid from
# the `homepage` ConfigMap. No secrets in this first pass (links only; widgets
# and their API keys come after Authelia gating). No PVC, so RollingUpdate is
# correct. Pinned to the worker like everything else — the control node is
# scheduling-disabled.
#
# Pinned to v1.13.2: the config schema and HOMEPAGE_ALLOWED_HOSTS behaviour
# drift between releases, so the version is explicit and the keys below were
# verified against this tag's docs. Notably (vs the older 0.9.x notes):
#   - the health endpoint is /api/healthcheck (not GET /)
#   - HOMEPAGE_ALLOWED_HOSTS MUST include the pod IP or the kubelet probe —
#     which hits the pod IP, not a hostname — 400s on host validation and the
#     pod never goes Ready. Hence MY_POD_IP + "$(MY_POD_IP):3000" below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  strategy: { type: RollingUpdate }
  selector:
    matchLabels: { app: homepage }
  template:
    metadata:
      labels: { app: homepage }
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1
      # Locked-down tier (ADR 011): homepage needs no root, it just serves HTTP
      # on a high port.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Seed the writable /app/config emptyDir with the files we author. Homepage
      # itself then fills in the rest of its skeleton set (proxmox/docker/
      # kubernetes.yaml, custom.js) on startup — it COPIES them into /app/config,
      # which is why that dir can't be a read-only ConfigMap mount (EROFS crash,
      # the 2026-07-23 incident).
      #
      # The glob is `/defaults/*`, not `*.yaml`: the ConfigMap also carries
      # custom.css. (The ConfigMap volume's own `..data`/`..2026_…` symlink dirs
      # start with a dot, so the glob doesn't match them.)
      initContainers:
        - name: seed-config
          image: busybox:1.37
          command: ["sh", "-c", "cp -L /defaults/* /app/config/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-src
              mountPath: /defaults
              readOnly: true
            - name: config
              mountPath: /app/config
        # Second EROFS trap, different directory. Homepage is a Next.js app that
        # SERVES A PRERENDERED PAGE built into the image (the "My First Service"
        # demo) and regenerates it via /api/revalidate, writing
        # /app/.next/server/pages/en.html. Under readOnlyRootFilesystem that
        # write fails EROFS, the page never regenerates, and the dashboard is
        # frozen on the demo content forever — no crash, just a wrong page.
        # (Only the service/bookmark lists self-correct, because those are
        # re-fetched client-side; title, header style and layout do not.)
        # So /app/.next/server/pages is an emptyDir too, seeded from the image
        # by this container — it has to be the homepage image, that's where the
        # built pages live.
        - name: seed-prerender
          image: ghcr.io/gethomepage/homepage:v1.13.2
          # `cp -r`, not `cp -a`: this runs as uid 1000 into a root-owned
          # emptyDir, and -a's chown/utimes attempts just print noise.
          command: ["sh", "-c", "cp -r /app/.next/server/pages/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: prerender
              mountPath: /seed
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # Ordered first: HOMEPAGE_ALLOWED_HOSTS interpolates $(MY_POD_IP),
            # and k8s only expands vars defined earlier in the list.
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Load-bearing. The value before the first comma (the pod IP) is
            # what the kubelet probe presents as Host; the rest are the public
            # hostnames. Miss any of these and that request 400s.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,dash.lan,dash.henrydowd.dev,home.dowd.ie"
            - { name: TZ, value: "Europe/Dublin" }
            - { name: PORT, value: "3000" }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
          # Burns the real config into the prerendered page BEFORE the pod goes
          # Ready: k8s holds off readiness/liveness until the startup probe
          # passes, and it stops probing after the first success. Without this
          # the first visitor after every restart gets served the image's demo
          # page until their browser triggers a revalidate.
          startupProbe:
            httpGet: { path: /api/revalidate, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /api/healthcheck, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthcheck, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            # Writable (emptyDir, seeded by the initContainer) so homepage can
            # copy its skeleton/provider files in at startup.
            - name: config
              mountPath: /app/config
            # readOnlyRootFilesystem needs writable scratch for the Next.js
            # render cache too (outside /app/config).
            - name: cache
              mountPath: /app/.next/cache
            # …and for the prerendered page /api/revalidate rewrites. Seeded
            # from the image by the seed-prerender initContainer above.
            - name: prerender
              mountPath: /app/.next/server/pages
      volumes:
        # ConfigMap is the SOURCE the initContainer copies from — never mounted
        # onto /app/config directly (read-only mount => EROFS on homepage's seed).
        - name: config-src
          configMap:
            name: homepage
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: prerender
          emptyDir: {}
