# Split into a gated public Ingress and an ungated one. The ForwardAuth
# middleware annotation attaches to the Ingress OBJECT, so the three hosts this
# app answers on cannot live in one object any more.
#
# dash.henrydowd.dev  gated, one_factor. This is the host phase 9 named as the
#                     precondition for the keyed live-data widgets.
# dash.lan            bare — outside the henrydowd.dev cookie domain (it would
#                     redirect-loop), trusted network, and the break-glass path
#                     when Authelia is down.
# home.dowd.ie        bare, and NOT because it is trusted: dowd.ie is a second
#                     apex, so the henrydowd.dev session cookie cannot cover it
#                     and ForwardAuth would loop exactly like .lan does. It is
#                     public and deliberately outside Cloudflare Access too.
#
# >>> CONSEQUENCE, do not miss this: home.dowd.ie serves the SAME pod as
# >>> dash.henrydowd.dev. Gating only the henrydowd.dev host does NOT make the
# >>> dashboard private, so phase 9's keyed widgets (Grafana/Immich/Proxmox API
# >>> keys rendered into the page) are still NOT safe to add. That stays blocked
# >>> until the dowd.ie decision in ADR 018 is made — drop the host, put it
# >>> behind Cloudflare Access, or give Authelia a second cookie domain.
#
# dash.* rides the *.henrydowd.dev wildcard (TLSStore default cert + cloudflared
# route + Technitium split-horizon) with zero extra DNS/cert/tunnel work, so
# those hosts carry no tls: block (ADR 007).
#
# home.dowd.ie is the exception (like file-parser's secure.dowd.ie): dowd.ie is
# a separate Cloudflare zone outside the shared TLSStore wildcard, so it needs
# its own SNI cert via the `tls:` block below (dowd-ie-tls, issued into this ns
# by certificate.yaml). It ALSO needs two things NOT in this repo — a cloudflared
# public-hostname route (token-mode tunnel = dashboard-managed) and a Technitium
# home.dowd.ie -> 192.168.1.200 record for LAN. Keep it out of any Cloudflare
# Access application so it stays public like the dash.* hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authelia-forceproto@kubernetescrd,authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dash.henrydowd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port: { number: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ungated
  namespace: homepage
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - home.dowd.ie
      secretName: dowd-ie-tls
  rules:
    - host: dash.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port: { number: 3000 }
    - host: home.dowd.ie
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port: { number: 3000 }
