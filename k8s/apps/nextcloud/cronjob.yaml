# Nextcloud's background jobs (file scans, notifications, share cleanup, etc.)
# run via cron.php. The admin panel nags unless this fires every 5 minutes.
# Same image as the main pod so PHP version + app code line up exactly; runs
# as www-data against the same data volume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  # Forbid: if a run is slow, don't start another on top of it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 280s — under the 5-minute schedule, so a stuck run gets killed before
      # the next one fires instead of stacking up.
      activeDeadlineSeconds: 280
      # Self-delete finished Jobs after 24h. This exists because of how
      # failedJobsHistoryLimit interacts with KubeJobFailed: the limit evicts a
      # failed Job only when a NEWER failure arrives, so an *isolated* failure
      # is retained forever and KubeJobFailed fires forever with it — emailing
      # every 6h until someone deletes the Job by hand.
      #
      # That is not hypothetical. Both nodes rebooted at 2026-09-02T15:40:35Z
      # and this CronJob fired 6s later, before postgres and the main pod were
      # up; the run hung and hit activeDeadlineSeconds above. Four earlier
      # failures self-cleared within minutes because they came in bursts and
      # evicted each other — the lone reboot one alerted for 25 hours.
      #
      # 24h keeps the Job and its pod logs for a full day of investigation
      # (the alert itself only fires 15m in), then lets the alert resolve on
      # its own instead of waiting for a human. Deliberately NOT applied to
      # the backup CronJobs: a failed backup is high-consequence and rare, and
      # should keep shouting until someone actually looks at it.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          # The data PVC is RWO (ReadWriteOnce) and attaches to whichever node
          # the main nextcloud pod runs on. Without this affinity the scheduler
          # can land the cron pod on a different node, where the volume can't
          # attach (Multi-Attach error); the run then hangs until
          # activeDeadlineSeconds and fails. Co-locate with the main pod so the
          # cron pod always shares its node and its already-attached volume.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: nextcloud
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: cron
              # Must stay byte-identical to the tag in nextcloud.yaml — this
              # runs occ against the same data dir, so a version skew here
              # is the same downgrade trap.
              image: nextcloud:33.0.7-apache
              command:
                [
                  "su",
                  "-s",
                  "/bin/sh",
                  "www-data",
                  "-c",
                  "php -f /var/www/html/cron.php",
                ]
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
