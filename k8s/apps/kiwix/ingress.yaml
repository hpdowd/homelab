# TWO Ingress objects, not one with two hosts. The ForwardAuth middleware
# annotation attaches to the Ingress OBJECT, so a single dual-host Ingress
# cannot gate wiki.henrydowd.dev while leaving wiki.lan alone — and it must,
# because .lan is outside the henrydowd.dev session-cookie domain and would
# redirect-loop forever.
#
# Public host: gated at one_factor (rule in k8s/apps/authelia/configmap.yaml).
# TWO middlewares, in this order: forceproto must run before forwardauth or the
# tunnel path 400s (Authelia rejects an http target — see middleware-proto.yaml).
# LAN host: deliberately bare. The LAN is a trusted network and this is also
# the break-glass path — if Authelia is down, wiki.lan still serves.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiwix
  namespace: kiwix
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authelia-forceproto@kubernetescrd,authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.henrydowd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kiwix
                port: { number: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiwix-lan
  namespace: kiwix
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kiwix
                port: { number: 8080 }
