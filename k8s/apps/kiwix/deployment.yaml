apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  namespace: kiwix
spec:
  replicas: 1
  selector:
    matchLabels: { app: kiwix }
  template:
    metadata:
      labels: { app: kiwix }
    spec:
      # Pod-level seccomp covers both the busybox init (chmod) and kiwix-serve.
      # No pod-level runAsNonRoot — the init container needs root to chmod the
      # freshly-provisioned volume.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Fresh Longhorn volumes come up root-owned; kiwix-serve runs as a
        # non-root user and needs to read the ZIMs. Blunt but fine — the
        # volume only ever holds public wiki dumps.
        - name: fix-permissions
          image: busybox:1.37
          command: ["sh", "-c", "chmod 777 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: kiwix
          image: ghcr.io/kiwix/kiwix-serve:3.7.0
          # kiwix-serve already runs as a non-root user in the image and only
          # reads ZIMs + binds a high port, so it needs no capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Via sh -c so the *.zim glob expands at startup — ZIM dumps are
          # copied onto the PVC by hand (kubectl cp), and this picks up
          # whatever is there without listing filenames in the manifest.
          # New ZIM = restart the pod.
          command: ["sh", "-c"]
          args: ["kiwix-serve --port=8080 /data/*.zim"]
          # libzim caches *decompressed* ZIM clusters, and the cache is bounded
          # by cluster count PER ZIM, not by bytes — so steady-state RSS scales
          # with (number of ZIMs x ZIM_CLUSTERCACHE x cluster size). The default
          # of 16 over the 12 ZIMs on this PVC works out to ~450MiB of anon
          # memory once enough of the library has been touched, which is what
          # OOMKilled this pod on 2026-08-15 against the 512Mi limit. It hid for
          # two months because wiki.henrydowd.dev serves ~0 req/s; a sustained
          # ~1-3 req/s crawl starting 2026-08-11 walked RSS 17MiB -> 454MiB over
          # three days and it never came back down.
          # 4 clusters x 12 ZIMs ~= 100MiB. Costs some decompression on a cache
          # miss, which is free in practice at this traffic level.
          # docs/lessons/k8s/kiwix-cluster-cache-oom.md
          env:
            - name: ZIM_CLUSTERCACHE
              value: "4"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            # 768Mi not 512Mi: the cache bound above should hold this near
            # ~150MiB, but cluster size varies per ZIM, so this is margin while
            # the bound is proven. Walk it back once the plateau is confirmed.
            limits: { memory: "768Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kiwix-data
