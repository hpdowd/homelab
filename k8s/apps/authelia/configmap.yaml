# Authelia's whole configuration except the secrets, which arrive as files via
# AUTHELIA_*_FILE env vars (see deployment.yaml). Everything in here is safe in
# plain git: no keys, no hashes, no passwords.
#
# Validated against 4.39.20 with:
#   docker run --rm -v "$PWD:/c" docker.io/authelia/authelia:4.39.20 \
#     authelia validate-config --config /c/configuration.yml
# Re-run that after ANY edit here and after every image bump. Authelia refuses
# to start on an unknown key rather than ignoring it, so a schema drift between
# 4.x minors is a CrashLoopBackOff, and because this pod gates other services
# that crashloop is an outage of everything ForwardAuth'd, not just of itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    theme: 'light'

    server:
      address: 'tcp://0.0.0.0:9091'
      # 4096 (the default read buffer) is too small for the forward-auth check
      # on proxmox.henrydowd.dev, and ONLY that host. Traefik replays the whole
      # client request's headers to /api/authz/forward-auth, so once PVE has
      # issued its own cookies the Cookie header carries all of: Cloudflare
      # Access's CF_Authorization JWT (~800B), authelia_session, PVEAuthCookie
      # (a ~450B signed ticket) and CSRFPreventionToken. Past 4096 total,
      # Authelia answers 431 and never sees the request, so every PVE API call
      # fails immediately AFTER a successful PVE login — which reads as "the
      # Proxmox login is broken" rather than as an Authelia fault. Measured on
      # the live pod: 3500B of cookie -> 302, 4000B -> 431.
      buffers:
        read: 16384
        write: 16384
      # Stops Authelia writing /app/.healthcheck.env on boot. That file feeds
      # the image's own healthcheck.sh, which nothing here uses — the pod is
      # probed with httpGet on /api/health — and writing it is the ONLY thing
      # that made the container fail against readOnlyRootFilesystem. Verified:
      # with this false and a read-only rootfs the pod dies during startup
      # checks with no useful error; with it true it starts clean and needs no
      # writable mount over /app.
      disable_healthcheck: true
      # The authz endpoints (/api/authz/forward-auth among them) are enabled by
      # default in 4.38+, so there is deliberately no `endpoints:` block here.
      # Declaring one REPLACES the defaults rather than adding to them, which
      # is an easy way to 404 the middleware.

    log:
      level: 'info'
      format: 'text'

    ntp:
      # Authelia NTP-checks the clock at startup because TOTP depends on it.
      # Keep the check (a skewed clock silently breaks every 2FA code) but stop
      # it being able to KILL startup: disable_failure downgrades an
      # unreachable time server from fatal to a logged warning. The nodes get
      # their time from the Proxmox host, so Authelia's own probe is a
      # second opinion, not the mechanism — and it is not worth letting an
      # external UDP dependency keep the cluster's auth gateway from booting.
      disable_failure: true

    totp:
      issuer: 'auth.henrydowd.dev'

    identity_validation:
      reset_password:
        # jwt_secret arrives via
        # AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.
        jwt_lifespan: '5 minutes'

    authentication_backend:
      # File backend, not LDAP: one or two humans live here (ADR 018). The
      # file is a SealedSecret mounted read-only, so `watch` picks up a resealed
      # users file without a pod restart.
      file:
        path: '/secrets/users/users.yml'
        watch: true
        password:
          algorithm: 'argon2'

    session:
      # session.secret arrives via AUTHELIA_SESSION_SECRET_FILE.
      name: 'authelia_session'
      expiration: '12 hours'
      inactivity: '2 hours'
      remember_me: '1 month'
      cookies:
        # ONE cookie domain. henrydowd.dev covers every gated host, which is
        # what makes a single login work across wiki/dash/proxmox/amp.
        #
        # Deliberately absent: `.lan` (not a parent of henrydowd.dev, and LAN
        # hosts are served by bare un-annotated Ingresses anyway) and dowd.ie.
        # dowd.ie needed a second cookie domain with its own authelia_url —
        # own cert, tunnel route and DNS record. That was resolved on
        # 2026-09-03 by dropping home.dowd.ie entirely rather than paying for
        # it, so one cookie domain still covers everything (ADR 018).
        - domain: 'henrydowd.dev'
          authelia_url: 'https://auth.henrydowd.dev'
          default_redirection_url: 'https://dash.henrydowd.dev'

    regulation:
      # Brute-force lockout. This is the only thing standing between a public
      # login page and an unlimited password-guessing budget.
      max_retries: 3
      find_time: '2 minutes'
      ban_time: '5 minutes'

    storage:
      # storage.encryption_key arrives via AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE.
      # Lose that key and this file is unreadable — see ADR 018's loss policy.
      local:
        path: '/data/db.sqlite3'

    notifier:
      # LOAD-BEARING, and not obvious: with the startup check enabled, a relay
      # that refuses the connection is FATAL. Verified against 4.39.20 — a bad
      # SMTP password produces
      #   error="failed to dial connection: SMTP AUTH failed: 535 5.7.8 ..."
      #   fatal="One or more providers had fatal failures performing startup
      #          checks" providers="[notification]"
      # and the process exits. That would let a rotated Brevo key, or Brevo
      # simply being down at the wrong moment, take the auth gateway with it
      # and 502 every ForwardAuth'd service — an email outage escalated into a
      # cluster-wide auth outage. Off, so a broken relay costs only the thing
      # it should: password-reset and verification mail.
      #
      # The trade is that a bad SMTP credential now fails quietly until someone
      # needs a reset email. Step 2 of the phase-8 plan covers that by
      # requiring a real password-reset mail to arrive before going further.
      disable_startup_check: true
      smtp:
        # Same Brevo relay and the same verified sender as Alertmanager
        # (victoria-metrics.yaml). The sender address is NOT arbitrary: Brevo
        # only accepts senders verified on the account, so reuse the one that
        # already works rather than inventing auth@ or noreply@.
        address: 'submission://smtp-relay.brevo.com:587'
        username: 'ae07ea001@smtp-brevo.com'
        # password arrives via AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE.
        sender: 'Authelia <homelab-monitor@henrydowd.dev>'
        # The startup check is disabled at the notifier level above, so this
        # address is only used if it is ever turned back on. It points at a
        # real mailbox in our own domain rather than the upstream default of
        # test@authelia.com, which a relay can legitimately refuse.
        startup_check_address: 'homelab-monitor@henrydowd.dev'

    telemetry:
      metrics:
        # Scraped by k8s/apps/monitoring/authelia-scrape.yaml. An auth outage
        # takes every ForwardAuth'd service down with it, so this is one of the
        # more load-bearing scrapes in the cluster.
        enabled: true
        address: 'tcp://0.0.0.0:9959'

    identity_providers:
      oidc:
        # hmac_secret and the jwks issuer key are deliberately NOT here. They
        # arrive from sealed-oidc.yaml as a SECOND --config file, because the
        # jwks private key is a structured list entry rather than a scalar and
        # so has no AUTHELIA_*_FILE env var that could carry it. seal-oidc.sh
        # documents the split, including the validate-config check that proves
        # Authelia deep-merges the two halves — a shallow merge would silently
        # drop every client registered below, and the symptom would be
        # "invalid_client" on an app that looks correctly configured.
        #
        # `client_secret` below is a PBKDF2 DIGEST, not the secret itself. That
        # is what makes this safe in plain git, exactly like the argon2 password
        # hashes in sealed-users.yaml: the matching plaintext lives only in the
        # client application and the password manager. Mint both halves with
        # ./new-oidc-client.sh, which prints the digest and the plaintext
        # side by side precisely because swapping them is the easy mistake.
        clients:
          - client_id: 'grafana'
            client_name: 'Grafana'
            client_secret: '$pbkdf2-sha512$310000$rs6fmbtagnzh4ugs7mM7pg$lB8be6aT01IobSQcF1KmHHH8Kdc/EV.Myfdg/ZMYyKY9vwIJOkQgUBYOeZ6Uv.a5s8TxE2BX/F9D3ImPkGXZUw'
            public: false
            # one_factor, not two_factor: Grafana is reachable only from the LAN
            # (see the websecure-only Ingress in k8s/apps/monitoring), so the
            # network is already doing the work a second factor would. amp and
            # proxmox are two_factor because they are reachable from the
            # internet, which this is not.
            authorization_policy: 'one_factor'
            # Explicit rather than defaulted. Grafana's OAuth client is
            # x/oauth2 with AuthStyleAutoDetect, which probes basic first, so
            # pinning Authelia's default here keeps the pair deterministic
            # instead of dependent on a probe.
            token_endpoint_auth_method: 'client_secret_basic'
            require_pkce: true
            pkce_challenge_method: 'S256'
            # A first-party app we run ourselves, so skip the consent screen.
            consent_mode: 'implicit'
            # MUST match Grafana's root_url exactly, scheme included. This host
            # is served by a websecure-only Ingress so it resolves on the LAN
            # over HTTPS and 404s through the tunnel — see that Ingress for why
            # a plain `grafana.henrydowd.dev` Ingress would publish Grafana to
            # the internet.
            redirect_uris:
              - 'https://grafana.henrydowd.dev/login/generic_oauth'
            scopes: ['openid', 'profile', 'email', 'groups']

        # The remaining five clients from the phase-8 plan are NOT registered
        # yet, on purpose. A client registration is only useful once its app is
        # actually wired, and minting a secret months early means a plaintext
        # that has to be kept safe with nothing using it. Add each one in the
        # commit that wires its app. The shape is the block above; the
        # per-app redirect URIs the plan settled on are:
        #
        #   gitea      https://git.henrydowd.dev/user/oauth2/authelia/callback
        #   nextcloud  https://nextcloud.henrydowd.dev/apps/user_oidc/code
        #   immich     https://immich.henrydowd.dev/auth/login
        #              app.immich:///oauth-callback        (mobile app)
        #   paperless  https://paperless.henrydowd.dev/accounts/oidc/authelia/login/callback/
        #   argocd     https://argocd.lan/auth/callback     (LAN-only, see plan)
        #
        # Verify each against its own app's docs before committing: a wrong
        # redirect_uri is not a validation error, it is a runtime
        # "invalid_redirect_uri" at the end of a login the user already did.

    access_control:
      default_policy: 'deny'

      networks:
        - name: 'lan'
          # NEVER add 10.42.0.0/16 here. That is the pod CIDR, and tunnel
          # traffic arrives from it (the cloudflared pod) — adding it would
          # make the entire internet count as "lan".
          networks: ['192.168.1.0/24']

      # These rules are INERT until the matching Ingress/IngressRoute carries
      # the forwardauth middleware: with no middleware, no request for that
      # host is ever shown to Authelia. That is deliberate — it lets the rules
      # ship ahead of enforcement so that gating a service is a one-line
      # annotation change per commit, per the phase-8 plan's step 4.
      rules:
        - domain: 'wiki.henrydowd.dev'
          policy: 'one_factor'

        # Gating this is the precondition for phase 9's keyed live-data
        # widgets, and as of 2026-09-03 the precondition is genuinely met:
        # home.dowd.ie was removed, so dash.henrydowd.dev and the ungated
        # dash.lan are the only hostnames left on this pod. Only the
        # henrydowd.dev host is listed here because dash.lan is served by a
        # separate bare Ingress and is trusted-network break-glass.
        - domain: 'dash.henrydowd.dev'
          policy: 'one_factor'

        # Two-factor for the two that reach real infrastructure. Proxmox is
        # gated on the tunnel path only, by design — see ADR 018.
        - domain:
            - 'proxmox.henrydowd.dev'
            - 'amp.henrydowd.dev'
          policy: 'two_factor'

        # Optional LAN softening, left off for now. First match wins, so these
        # would have to go ABOVE the two_factor rule to have any effect:
        #   - domain: 'amp.henrydowd.dev'
        #     networks: ['lan']
        #     policy: 'one_factor'
