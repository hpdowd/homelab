# Why this is an IngressRoute (not a plain Ingress): the backend speaks HTTPS
# with a self-signed cert on :8006, so the route must say "talk https to the
# backend and skip verification" — only IngressRoute + servers-transport.yaml
# can. Background: docs/lessons/networking/proxmox-502-selfsigned-tunnel.md.
#
# Why TWO routes: Proxmox must be reachable over HTTPS *by the browser*, because
# PVE issues its auth cookie as `Secure` (hardcoded in APIServer Formatter.pm).
# A plain-HTTP browser silently drops that cookie, so login "succeeds" and then
# every call 401s. But the public path can't be HTTPS-to-Traefik: cloudflared
# delivers the tunnel over plain HTTP on `web` and 404s if pinned to websecure
# (gotchas.md). And a Traefik IngressRoute is only served on websecure if it
# carries a `tls` block, while a `tls` block makes it TLS-only and 404s `web`
# (both verified). So the two concerns get one route each:
#
#   proxmox            web entrypoint, no tls. Carries the Cloudflare tunnel
#                      (proxmox.henrydowd.dev, plain HTTP — the browser is still
#                      HTTPS at CF's edge, so the cookie survives). http://
#                      proxmox.lan is bounced to HTTPS instead of served plain,
#                      or its Secure cookie would be dropped on the LAN. The
#                      redirect is NOT applied to the tunnel host — that would
#                      make cloudflared redirect-loop.
#   proxmox-websecure  websecure entrypoint, tls:{}. LAN clients resolve both
#                      names straight to Traefik (Technitium split-horizon) and
#                      hit it over HTTPS; TLS terminates with the default
#                      wildcard cert (TLSStore default, traefik ns).
#
# AUTHELIA (phase 8): the forwardauth middleware is on the TUNNEL rule only —
# the Host(`proxmox.henrydowd.dev`) rule of the `proxmox` route below, which is
# the path every request from the internet takes. The `proxmox-websecure` route
# is deliberately left UNGATED, and it is worth being explicit that this is a
# choice rather than an oversight, because it means a LAN client reaching
# https://proxmox.henrydowd.dev under split-horizon DNS bypasses Authelia
# entirely.
#
# That is the point. Proxmox is where you go to fix the cluster, and Authelia
# runs *on* the cluster: gating the LAN path would mean a failed Authelia pod,
# a corrupted session DB, or a bad config sync could lock you out of the
# hypervisor that hosts the thing you need to repair. The LAN is already the
# trust boundary for that class of access (same reasoning as the bare .lan
# Ingresses on kiwix/amp/homepage). The internet-facing path, which is the one
# that was genuinely unauthenticated before this phase, is now two_factor.
#
# Splitting proxmox-websecure per-host to gate the henrydowd.dev name on the
# LAN too was considered and rejected for the reason above. See ADR 018.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: proxmox
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: proxmox
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`proxmox.henrydowd.dev`)
      kind: Rule
      # two_factor via the ACL in k8s/apps/authelia/configmap.yaml. The PVE
      # login screen still appears afterwards — Authelia is a perimeter in
      # front of it, not a replacement for it.
      # forceproto MUST come first: the tunnel arrives on `web` as plain HTTP
      # and Authelia 400s an http target (see middleware-proto.yaml).
      middlewares:
        - name: forceproto
          namespace: authelia
        - name: forwardauth
          namespace: authelia
      services:
        - name: proxmox-external
          port: 8006
          scheme: https
          serversTransport: insecure-transport
    - match: Host(`proxmox.lan`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: proxmox-external
          port: 8006
          scheme: https
          serversTransport: insecure-transport
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox-websecure
  namespace: proxmox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`proxmox.lan`) || Host(`proxmox.henrydowd.dev`)
      kind: Rule
      services:
        - name: proxmox-external
          port: 8006
          scheme: https
          serversTransport: insecure-transport
  tls: {}
