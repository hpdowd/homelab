# The Vodafone Ultra 7 Hub, the LAN gateway. HTTP only — it serves nothing on
# 443.
#
# Gotcha: ArgoCD excludes EndpointSlices by default. Without the argocd-cm
# patch (rebuild runbook step 6) this never syncs and Traefik returns
# "no available server".
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: router
  namespace: router
  labels:
    kubernetes.io/service-name: router
addressType: IPv4
ports:
  - port: 80
endpoints:
  - addresses: ["192.168.1.1"]
    conditions:
      ready: true
