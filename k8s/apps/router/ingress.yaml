# router.lan -> the home router's admin UI.
#
# WHY THIS GOES THROUGH TRAEFIK AT ALL, when a plain A record in Technitium
# would be the obvious way: the hub's web server rejects any request whose Host
# header is not its own IP — DNS-rebinding protection it gives no way to turn
# off. Measured 2026-09-16 from the PVE host:
#
#   curl http://192.168.1.1/                        -> 200
#   curl -H 'Host: router.lan' http://192.168.1.1/  -> 403
#
# So `router.lan A 192.168.1.1` resolves perfectly and then 403s in the
# browser, because the browser sends `Host: router.lan`. DNS cannot fix that;
# only something that rewrites the Host on the way through can, which is what
# passhostheader below does.
#
# LAN-only by design. There is deliberately no henrydowd.dev name here and the
# router must never get one — this is the box that owns the network, and the
# gated hosts reach real infrastructure through Authelia precisely so that
# something like this does not sit on the public side.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router
  namespace: router
  annotations:
    # Send the backend's own host (192.168.1.1) upstream instead of the
    # client's `router.lan`. Without this every request is a 403 and it reads
    # as the router being broken rather than as a Host-header check.
    traefik.ingress.kubernetes.io/service.passhostheader: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: router.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router
                port:
                  number: 80
