# router.lan -> the home router's admin UI, via the nginx proxy in this
# namespace. Traefik does not talk to the hub directly.
#
# WHY NOT A PLAIN A RECORD IN TECHNITIUM, which is the obvious way: the hub's
# web server 403s any request whose Host header is not its own IP — rebinding
# protection it gives no way to turn off. Measured 2026-09-16 from the PVE
# host:
#
#   curl http://192.168.1.1/                        -> 200
#   curl -H 'Host: 192.168.1.1:80' http://…         -> 200
#   curl -H 'Host: router.lan'     http://…         -> 403
#   ...and vodafone.hub, hub, router, fritz.box     -> 403
#
# So `router.lan A 192.168.1.1` resolves perfectly and then 403s in the
# browser, because the browser sends `Host: router.lan`. DNS cannot rewrite a
# Host header.
#
# WHY NOT JUST service.passhostheader ON TRAEFIK, which was the first attempt
# and does fix the 403: the hub then issues its session cookie with
# `Domain=192.168.1.1`, the browser discards it as out-of-scope for router.lan,
# and login bounces back to the login page forever. Fixing that needs a
# Set-Cookie rewrite, which Traefik has no native middleware for. Hence nginx —
# see configmap.yaml.
#
# LAN-only by design. There is deliberately no henrydowd.dev name here and the
# router must never get one — this is the box that owns the network, and the
# gated hosts reach real infrastructure through Authelia precisely so that
# something like this does not sit on the public side.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router
  namespace: router
spec:
  ingressClassName: traefik
  rules:
    - host: router.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router
                port:
                  number: 80
