# Alert rules specific to this homelab. Sit alongside the chart's bundled
# Kubernetes rules in vmalert; the rules here cover failure modes I've actually
# hit on this hardware (memory pressure, OOMs, the RWO Longhorn pain point,
# silently broken backups).
#
# The operator picks up VMRule CRDs (NOT PrometheusRule — one wrong kind
# fails the whole Application's sync batch, see the grafana-monitoring-sync
# cascade lesson) and feeds them to vmalert.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: vm-k8s-stack
spec:
  groups:
    - name: homelab.memory
      rules:
        # Per-node thresholds — the two nodes have very different roles and
        # headroom, so a single global threshold doesn't fit either well.
        #
        # Control (4GiB, k3s control plane only): loose. It runs no app
        # workloads, so it normally sits with plenty free; only warn once it's
        # genuinely squeezed. 0.75GiB free for 5m.
        - alert: NodeMemoryLowControl
          expr: |
            node_memory_MemAvailable_bytes{instance="192.168.1.10:9100"} < 805306368
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Low available memory on control node ({{ $labels.instance }})"
            description: "Available memory < 0.75Gi for 5m on k3s-control. Something heavy got scheduled onto the control plane — investigate."

        # Worker1 (14GiB, runs every app): tight. This is the node that gates
        # adding workloads (e.g. Immich), so warn with a fat 2GiB cushion still
        # remaining — early enough to act before anything OOMs. 2GiB free for 5m.
        - alert: NodeMemoryLowWorker
          expr: |
            node_memory_MemAvailable_bytes{instance="192.168.1.11:9100"} < 2147483648
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Low available memory on worker node ({{ $labels.instance }})"
            description: "Available memory < 2Gi for 5m on k3s-worker1. Check before adding workloads (e.g. Immich)."

        # Watches the two k3s VMs (node-exporter doesn't see the Proxmox
        # host). >60% sustained means real memory pressure, not just normal
        # cache eviction. The `> 0` in the divisor doubles as a guard: nodes
        # with no swap drop out instead of dividing by zero.
        - alert: NodeSwapClimbing
          expr: |
            (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes)
              / (node_memory_SwapTotal_bytes > 0) > 0.6
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Swap usage high on {{ $labels.instance }}"
            description: "Sustained swap > 60%. Real memory pressure — investigate the heaviest pods."

        # OOMKills are loud and worth waking up for. The `and on(...)` joins
        # the restart counter to the termination-reason metric so we only fire
        # when the restart was actually caused by OOM (not a normal redeploy).
        - alert: PodOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 0
            and on(namespace, pod)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "OOMKilled: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "A container was OOMKilled. Its memory limit is too low or the node is starved."

    - name: homelab.workloads
      rules:
        # CrashLoopBackOff in disguise — k8s' actual state is fiddly to alert
        # on, but ">3 restarts in 15m" catches it reliably.
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CrashLoopBackOff: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "More than 3 restarts in 15m."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} degraded"
            description: "Desired != available replicas for 10m."

    - name: homelab.storage
      rules:
        # 85% is high enough to ignore daily noise, low enough to act on. Both
        # the OS SSD and the Longhorn vdb get watched here.
        - alert: DiskFillingUp
          expr: |
            (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Disk > 85% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
            description: "Filesystem usage high. The vdb (Longhorn) and the OS SSD both matter."

        # Longhorn's own metric. This Longhorn version (1.11) exposes
        # robustness as one 0/1 series per state (label `state`:
        # unknown/healthy/degraded/faulted), NOT the old single 0–3 gauge —
        # the first version of this rule compared `== 2` and could never
        # fire. Verified against live series this time.
        # Degraded means a replica is missing; faulted is data-loss
        # territory. Both need looking at straight away.
        - alert: LonghornVolumeDegraded
          expr: |
            longhorn_volume_robustness{state=~"degraded|faulted"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc }} ({{ $labels.pvc_namespace }}) is {{ $labels.state }}"
            description: "RWO single-attach pain point. Check the volume and the worker node."

        # Guard for the alert above. This rule spent weeks dead because the
        # longhorn_* metrics were never scraped — the alert can't fire on data
        # that doesn't exist, which is its own silent failure. If the Longhorn
        # scrape (longhorn-scrape.yaml) breaks, this fires instead.
        - alert: LonghornMetricsAbsent
          expr: |
            absent(longhorn_volume_robustness)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn metrics missing from VictoriaMetrics"
            description: "longhorn_volume_robustness has no series — the Longhorn scrape is broken, so LonghornVolumeDegraded is blind. Check the VMServiceScrape and vmagent targets."

        # The condition that silently disabled auto-salvage for 16h on
        # 2026-07-25. Longhorn skips any replica whose disk is unschedulable
        # when it tries to salvage, so `auto-salvage=true` was true and
        # useless — the manager logged "Bringing up 0 replicas" 4,367 times
        # overnight and recovered nothing.
        #
        # Nothing else surfaces this. An unschedulable disk causes no symptom
        # at all while volumes stay attached; it only bites at the exact
        # moment you need recovery. Verified against live series: the worker's
        # disk reads 0 today, control's reads 1.
        - alert: LonghornDiskUnschedulable
          expr: |
            longhorn_disk_status{condition="schedulable"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is unschedulable"
            description: "Auto-salvage cannot select replicas on this disk, so a faulted volume will NOT self-heal. Usually over-provisioning: Longhorn counts provisioned PVC size, not actual usage. See docs/lessons/storage/longhorn-autosalvage-blocked-diskpressure.md"

        # The warning that would have caught the above before it mattered.
        # Fires while there is still headroom, rather than after the disk has
        # already crossed into DiskPressure.
        #
        # Expressed as a ratio, not absolute bytes, deliberately. An absolute
        # "< 20GiB headroom" threshold sits 0.13GiB away from firing on the
        # control node, which permanently reads -20.3GiB (29GiB OS disk, 30%
        # reserved, zero replicas scheduled because control has
        # allowScheduling=false). The ratio reads 0 there and can't
        # false-positive. Verified live: control 0, worker 1.021.
        - alert: LonghornProvisioningHeadroomLow
          expr: |
            longhorn_node_storage_scheduled_bytes
              / (longhorn_node_storage_capacity_bytes - longhorn_node_storage_reservation_bytes)
              > 0.9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn provisioning headroom < 20GiB on {{ $labels.node }}"
            description: "Scheduled (provisioned, not used) size is approaching capacity minus reservation. Crossing it flips the disk unschedulable and disables auto-salvage. Reduce storageReserved or right-size the largest PVC before adding services."

    - name: homelab.backups
      rules:
        # A silently-broken backup is the worst failure mode here — you only
        # find out when you need it. Fire on the first failed run.
        #
        # Deliberately NOT scoped to a namespace list. It used to read
        # `namespace=~"nextcloud|gitea|immich"`, which meant paperless went
        # live on 2026-07-23 with a nightly restic job that nothing watched —
        # 25 days of unmonitored backups, found on 2026-08-18. The docs,
        # the restore runbook and backup-verification.md had all been updated
        # to include paperless; only this regex was missed. Any hardcoded app
        # list here rots the same way, so match on the job name instead and
        # let new services be covered the day they start backing up.
        #
        # The `unless` is what lets it resolve. kube_job_status_failed counts
        # failed *pod attempts* and never decrements, so with backoffLimit 1 a
        # run that failed once and succeeded on the retry kept this firing until
        # the Job object aged out of successfulJobsHistoryLimit — three days of
        # a critical alert for a backup that is sitting in B2. Suppressing on
        # succeeded keeps the early warning (it still fires the moment an
        # attempt dies) but clears it once the retry lands. If both attempts
        # fail the Job never succeeds and the alert stays up, which is the case
        # that matters.
        - alert: BackupJobFailed
          expr: |
            kube_job_status_failed{job_name=~".*backup.*"} > 0
              unless on (namespace, job_name)
            kube_job_status_succeeded{job_name=~".*backup.*"} > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Backup job failed: {{ $labels.namespace }}/{{ $labels.job_name }}"
            description: "A restic backup CronJob failed. Check logs; verify B2 repo with restic check."

        # Catches the case where the CronJob isn't even running — e.g. the
        # whole job got deleted, schedule broken, or the cluster was down at
        # 03:00. 26h gives a bit of buffer past the 24h cadence.
        #
        # `by (namespace)` makes this self-scoping: every namespace that has
        # backup Jobs gets its own series, so new services are covered without
        # touching this rule. What it can NOT see is a namespace whose backups
        # vanish entirely — no Jobs means no series means nothing to compare
        # against. BackupJobsAbsent below is the guard for that.
        - alert: BackupJobMissing
          expr: |
            time() - max by (namespace) (
              kube_job_status_completion_time{job_name=~".*backup.*"}
            ) > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No recent backup in {{ $labels.namespace }}"
            description: "No successful backup job completed in > 26h. The daily CronJob may not be running."

        # Guard for BackupJobMissing (same pattern as LonghornMetricsAbsent
        # and PortfolioMetricsAbsent). The two rules above are self-scoping,
        # which is what stops the paperless gap recurring — but self-scoping
        # cuts both ways: delete a CronJob, let its last Job age out of
        # successfulJobsHistoryLimit, and the namespace simply stops existing
        # as far as they're concerned. No series, no alert, no backup.
        #
        # So this is the one place the expected set is written down. It is a
        # list that must be updated when a service starts or stops being
        # backed up, but its failure mode is loud (it fires) rather than
        # silent, which is the right way round. Keep it in step with the
        # `for ns in ...` loops in docs/runbooks/backup-verification.md.
        #
        # successfulJobsHistoryLimit is 3 on all four CronJobs against a daily
        # schedule, so a completed Job is always present in steady state; the
        # 1h `for` rides out the gap while a run is in flight. Verified live:
        # all four namespaces return no series, and the same expression with a
        # bogus namespace appended returns exactly one, labelled — i.e. this
        # guard can actually fire, unlike the first cut of the Longhorn one.
        - alert: BackupJobsAbsent
          expr: |
            absent(kube_job_status_completion_time{namespace="nextcloud", job_name=~".*backup.*"})
            or absent(kube_job_status_completion_time{namespace="gitea", job_name=~".*backup.*"})
            or absent(kube_job_status_completion_time{namespace="immich", job_name=~".*backup.*"})
            or absent(kube_job_status_completion_time{namespace="paperless", job_name=~".*backup.*"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No backup jobs at all in {{ $labels.namespace }}"
            description: "kube_job_status_completion_time has no backup-job series for {{ $labels.namespace }}, so BackupJobMissing is blind there. The CronJob was probably deleted or never recreated. Check `kubectl -n {{ $labels.namespace }} get cronjob`."
    - name: homelab.portfolio
      rules:
        # The portfolio's live panels read VictoriaMetrics and Gitea over the
        # cluster network. The service stays up if one is unreachable (it
        # degrades gracefully and keeps serving the last good data), but the
        # page goes stale — worth a warning, not a page. portfolio_upstream_up
        # is a 1/0 gauge per upstream {vm,gitea}, self-reported by the service
        # (it scrapes back into VM — the Tier-3 recursion).
        - alert: PortfolioUpstreamDown
          expr: |
            portfolio_upstream_up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Portfolio upstream {{ $labels.upstream }} unreachable"
            description: "portfolio_upstream_up{upstream=\"{{ $labels.upstream }}\"} has been 0 for 10m — the live panel fed by {{ $labels.upstream }} is stale. Check that Service and the portfolio pod."

        # Guard for the alert above (same pattern as LonghornMetricsAbsent): if
        # the portfolio scrape breaks, portfolio_upstream_up disappears and
        # PortfolioUpstreamDown can never fire — a silent failure. This catches
        # that, and also trips if the deployment is scaled to zero / removed.
        - alert: PortfolioMetricsAbsent
          expr: |
            absent(portfolio_upstream_up)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Portfolio metrics missing from VictoriaMetrics"
            description: "portfolio_upstream_up has no series for 15m — the portfolio VMServiceScrape is broken or the pod is down, so PortfolioUpstreamDown is blind. Check the VMServiceScrape and vmagent targets."
