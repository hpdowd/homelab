# Sealed Secrets as a declarative Application, replacing the hand-install.
#
# ─── READ BEFORE SYNCING ──────────────────────────────────────────────────
# Deliberately WITHOUT `syncPolicy.automated`, for the same reason as
# longhorn.yaml: this is a live hand-installed Helm release, and the parent
# `infrastructure` app auto-syncs. Committing this creates the Application
# object; nothing reaches the cluster until someone syncs it on purpose.
#
# Do NOT "Sync All" in the ArgoCD UI while this is unsynced.
#
# This one carries a specific hazard the others do not. **The controller's
# private key is the trust root for every SealedSecret in this repo.** It
# lives in Secrets labelled `sealedsecrets.bitnami.com/sealed-secrets-key`
# in kube-system. If a sync ever deletes or replaces those, every
# SealedSecret in git becomes undecryptable and every dependent app stops
# starting. `prune` must stay off, and the key Secrets are excluded below.
#
# Before syncing:
#   1. Confirm the master key is backed up and that the backup is the one
#      currently in the cluster:
#        kubeseal --fetch-cert | diff - <path-to-backup-cert>
#      If that does not match, stop. Fix the backup first.
#   2. Diff. Expect drift only in chart-managed metadata; the running
#      release was installed from this exact chart version with the same
#      single value override, so the diff should be close to empty.
#   3. Sync, then re-seal nothing — verify instead that an existing app can
#      still read its secret (`kubectl -n gitea get secret ...`).
#
# Why bother: as of 2026-07-27 this was the only piece of the stack with no
# declarative source at all. It was not in k8s/, and cluster-rebuild.md §4
# described installing it from the upstream raw manifest — which is not how
# it got here. The live install is Helm chart 2.18.6. A rebuild that
# followed the runbook would have produced a differently-shaped install
# than the one being replaced, which is the worst time to discover a
# difference.
# ──────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  # No resources-finalizer, matching every other app here. Deleting this
  # Application must never cascade into the controller's key material.
spec:
  project: default
  source:
    # NOT bitnami-labs.github.io. The project moved from the `bitnami-labs`
    # org to `bitnami` on 2026-06-15, and GitHub Pages does not redirect
    # across an org move the way git and browser links do — the old URL
    # returns a bare 404. The live controller was installed from the old
    # address in May, so this is a dependency that silently expired
    # underneath a running cluster. Found 2026-07-27 when ArgoCD failed to
    # render this Application.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # Pinned to the version currently running: chart 2.18.6, app 0.37.0.
    # Read from the live release, not chosen — `helm list -n kube-system`.
    targetRevision: 2.18.6
    helm:
      values: |
        # The only value the hand-install set. Without it the chart names the
        # Deployment `sealed-secrets`, and every runbook, the kubeseal
        # default and the restore procedure all say
        # `sealed-secrets-controller`. Changing it would rename the live
        # Deployment on sync.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    # kube-system, because that is where it lives today and where kubeseal
    # looks by default.
    namespace: kube-system
  # syncPolicy intentionally omitted — manual sync only. See header.
  # Once adopted, the most this should ever get is:
  #   syncPolicy:
  #     automated: { prune: false, selfHeal: true }
  # `prune: false` is not optional here. See the header.
  #
  # No ignoreDifferences for the key material, deliberately. The controller
  # creates its keys at runtime with generated names
  # (`sealed-secrets-keybxg9k`, and two older ones it retains so previously
  # sealed values still decrypt), so there is no fixed name to match and the
  # chart never renders them. ArgoCD does not track what it did not apply,
  # so they cannot show as drift and cannot be pruned. The prune warning in
  # the header stands anyway: it costs nothing and the failure mode is
  # unrecoverable.
