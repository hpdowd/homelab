apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  # No resources-finalizer (same as every other app here): deleting the
  # Application must never cascade-delete live resources. The monitoring
  # namespace has needed force-finalizer surgery before (see HOMELAB gotcha
  # / vm-operator pattern) — orphaning on delete is the safer default.
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    # Pin to a specific chart version. Floating ("0.48.x") would let an
    # autosync silently roll values schema changes onto us. Bump deliberately.
    targetRevision: 0.81.0
    helm:
      releaseName: vm
      values: |
        # Global default: pin everything to the worker. The control node only
        # has 4GiB RAM and runs the k3s control plane, so we keep workloads off
        # it. node-exporter is a DaemonSet and overrides this below so we still
        # get host metrics from control too.
        nodeSelector:
          kubernetes.io/hostname: k3s-worker1

        # vmsingle = the single-node VictoriaMetrics TSDB. The chart also
        # supports a cluster mode (vmstorage/vmselect/vminsert), which is
        # pointless overhead when there's only one worker.
        vmsingle:
          enabled: true
          spec:
            retentionPeriod: "30d"
            nodeSelector:
              kubernetes.io/hostname: k3s-worker1
            # local-path, not Longhorn. Monitoring data is regenerable — if
            # the worker dies we lose history but nothing important, and we
            # don't want to spend Longhorn replicas (or the 500GB vdb) on it.
            # See ADR 005.
            storage:
              accessModes: ["ReadWriteOnce"]
              storageClassName: local-path
              resources:
                requests:
                  storage: 10Gi
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Hard ceiling — a runaway scrape shouldn't be able to OOM the node.
                memory: 2Gi
            extraArgs:
              # Cap VM's in-memory caches at 40% of the memory limit above,
              # leaving headroom under the 2Gi ceiling for query/ingest spikes.
              memory.allowedPercent: "40"

        vmcluster:
          enabled: false

        # vmalert evaluates the rules in homelab-rules.yaml plus the chart's
        # built-in Kubernetes rules. Sends firing alerts to alertmanager.
        vmalert:
          enabled: true
          spec:
            nodeSelector:
              kubernetes.io/hostname: k3s-worker1
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi

        # Alertmanager: dedupes and routes alerts. Criticals go to Pushover
        # and email, everything else to email only, and Watchdog feeds a
        # dead-man's switch at healthchecks.io (ADR 019). Each secret listed
        # under spec.secrets is a SealedSecret, mounted at
        # /etc/vm/secrets/<name>/ and read from file, never inlined.
        alertmanager:
          enabled: true
          spec:
            nodeSelector:
              kubernetes.io/hostname: k3s-worker1
            secrets:
              - alertmanager-smtp
              - alertmanager-pushover
              - alertmanager-healthchecks
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: "smtp-relay.brevo.com:587"
              smtp_from: "homelab-monitor@henrydowd.dev"
              smtp_auth_username: "ae07ea001@smtp-brevo.com"
              smtp_auth_password_file: /etc/vm/secrets/alertmanager-smtp/smtp_password
              smtp_require_tls: true
            route:
              receiver: "email"
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              # 6h on warnings — long enough that I'm not getting spammed,
              # short enough that I'll see something still firing the next morning.
              repeat_interval: 6h
              routes:
                # The dead-man's switch. Watchdog always fires, so this pings
                # healthchecks.io about once a minute: repeat_interval under
                # group_interval re-sends on every 1m flush. When the pings
                # stop (power cut, host or worker down, WAN down, vmalert or
                # Alertmanager broken) healthchecks.io notices from outside
                # the house after 1m period + 10m grace, and tells Pushover
                # and email. Nothing in here can report its own absence.
                # Watchdog must still never reach email or Pushover; see the
                # null-route-typo lesson. Alertmanager logs "repeat_interval is
                # less than group_interval" on every reload because of this
                # route. That is the intent, not a mistake.
                - receiver: "deadman"
                  matchers:
                    - alertname = "Watchdog"
                  group_wait: 0s
                  group_interval: 1m
                  repeat_interval: 50s

                # KubeCPU/MemoryOvercommit fire permanently on a 2-node
                # cluster ("cannot tolerate node failure" — true by design
                # here). Null-routed rather than disabled so they stay
                # visible in vmalert/Grafana without emailing every 6h.
                # NodeRecentlyBooted only exists to feed the inhibit rule
                # below.
                - receiver: "null"
                  matchers:
                    - alertname =~ "InfoInhibitor|NodeRecentlyBooted|KubeCPUOvercommit|KubeMemoryOvercommit"

                # One failed run of the 5-minute Nextcloud cron means nothing,
                # and one fails after every boot. Its Job is kept 24h, so this
                # emailed every 6h for a day each time. NextcloudCronStale in
                # homelab-rules.yaml alerts on an hour without a successful
                # run instead. Other Jobs in the namespace still email.
                - receiver: "null"
                  matchers:
                    - alertname = "KubeJobFailed"
                    - namespace = "nextcloud"
                    - job_name =~ "nextcloud-cron-.*"

                # Criticals also go to the phone. A route of its own with
                # `continue` so the email route below still matches, and so it
                # can repeat less often: something like BackupJobMissing after
                # a power cut stays up until I fix it, and the phone doesn't
                # need telling every hour. Email stays the fallback if
                # Pushover breaks; AlertmanagerFailedToSendAlerts is a warning,
                # so it reaches me there.
                - receiver: "pushover"
                  matchers:
                    - severity = "critical"
                  repeat_interval: 4h
                  continue: true

                # Criticals nag every hour until acknowledged or resolved.
                - receiver: "email"
                  matchers:
                    - severity = "critical"
                  repeat_interval: 1h
            receivers:
              - name: "null"
              - name: "deadman"
                webhook_configs:
                  - url_file: /etc/vm/secrets/alertmanager-healthchecks/ping_url
                    # Must stay false. If vmalert dies, Watchdog resolves,
                    # and a resolve would land as one more successful ping,
                    # hiding exactly the failure this exists to catch.
                    send_resolved: false
              - name: "email"
                email_configs:
                  - to: "henry@dowd.ie"
                    send_resolved: true
              - name: "pushover"
                pushover_configs:
                  - user_key_file: /etc/vm/secrets/alertmanager-pushover/user_key
                    token_file: /etc/vm/secrets/alertmanager-pushover/token
                    # Upstream defaults to emergency (2) on firing, which
                    # repeats until acknowledged. 0 respects the app's quiet
                    # hours, so a critical at 3am waits for the morning, and
                    # -1 delivers the resolve with no sound at all.
                    priority: '{{ if eq .Status "firing" }}0{{ else }}-1{{ end }}'
                    # One line per alert. The default is every annotation run
                    # together, which is unreadable on a lock screen.
                    message: '{{ range .Alerts }}{{ or .Annotations.summary .Labels.alertname }}{{ "\n" }}{{ end }}'
                    # The default links to Alertmanager's in-cluster address,
                    # which the phone can't open. Grafana answers on the LAN
                    # and over the VPN.
                    url: "https://grafana.henrydowd.dev"
                    url_title: "Grafana"
                    send_resolved: true
            # If a critical is firing for the same alertname+namespace, don't
            # also send the warning version of it. Cuts noise during incidents.
            inhibit_rules:
              - source_matchers: [severity = "critical"]
                target_matchers: [severity = "warning"]
                equal: ["alertname", "namespace"]
                # InfoInhibitor suppresses lone info alerts; they only
                # surface alongside a warning/critical in the same namespace.
              - source_matchers: [alertname = "InfoInhibitor"]
                target_matchers: [severity = "info"]
                equal: ["namespace"]
                # Hold back warnings for 30 minutes after any node boots;
                # every boot brings a burst of PodCrashLooping that clears
                # itself (NodeRecentlyBooted in homelab-rules.yaml has the
                # numbers). Held, not dropped: anything still firing when the
                # window closes is sent then. Not the restart notices, which
                # are the point, and never criticals.
              - source_matchers: [alertname = "NodeRecentlyBooted"]
                target_matchers:
                  - severity = "warning"
                  - alertname !~ "ProxmoxHostRestarted|NodeRebooted"

        # k3s bundles the controller-manager, scheduler, kube-proxy, and datastore
        # into the single k3s server process — none are exposed as the separately
        # scrapeable endpoints a kubeadm cluster has. Left enabled, these scrape
        # jobs are permanently-down targets that trip TargetDown plus the
        # per-component *Down alerts. Turn the ServiceMonitors off here; the
        # matching alert rules are disabled under defaultRules below.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:                # k3s defaults to embedded SQLite, not etcd
          enabled: false
        kubeProxy:
          enabled: false

        # node-exporter scrapes host-level metrics (CPU, RAM, disk, network).
        # DaemonSet — runs on every node, including control. Clearing the
        # global nodeSelector + adding a blanket toleration is what lets it
        # override the worker-only pin.
        prometheus-node-exporter:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 48Mi
          nodeSelector: {}
          tolerations:
            - effect: NoSchedule
              operator: Exists

        # kube-state-metrics turns k8s objects (pods, deployments, jobs) into
        # metrics so we can alert on things like "deployment has 0 ready replicas".
        kube-state-metrics:
          enabled: true
          nodeSelector:
            kubernetes.io/hostname: k3s-worker1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        grafana:
          enabled: true
          nodeSelector:
            kubernetes.io/hostname: k3s-worker1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          admin:
            existingSecret: grafana-admin-creds
            userKey: admin-user
            passwordKey: admin-password
          # persistence off → Grafana runs on an emptyDir, not a PVC. Its SQLite
          # (users, prefs, starred boards) is ephemeral and resets when the pod is
          # rescheduled — which is the point: a reused local-path PVC once carried
          # a corrupted SQLite DB across namespace deletions and crash-looped every
          # reinstall (docs/lessons/k8s/grafana-pvc-corruption.md). Nothing
          # important lives here — dashboards are ConfigMaps in git (sidecar below)
          # and the admin login is recreated from the grafana-admin-creds
          # SealedSecret on every start. storageClassName/size are inert while
          # disabled; kept for if we ever flip it on.
          persistence:
            enabled: false
            storageClassName: local-path
            size: 2Gi
          # The sidecar watches for ConfigMaps with `grafana_dashboard: "1"`
          # and auto-loads them. That's how grafana-dashboard-capacity.yaml
          # gets picked up — no UI imports needed.
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            # Datasource sidecar off — the VictoriaMetrics datasource is declared
            # inline below instead of discovered from a ConfigMap.
            datasources:
              enabled: false
          ingress:
            enabled: true
            ingressClassName: traefik
            # Don't pin router.entrypoints — see the comment in
            # nextcloud/ingress.yaml for the full story. tl;dr: cloudflared
            # speaks plain HTTP, websecure-only routers 404.
            annotations: {}
            # This host stays grafana.lan ONLY. The HTTPS host Grafana now
            # advertises as root_url, grafana.henrydowd.dev, is served by a
            # separate websecure-only Ingress in k8s/apps/monitoring, because it
            # needs an entrypoint pin that this block must not have — see the
            # note directly above and that file's header.
            #
            # Adding grafana.henrydowd.dev to THIS list instead would publish
            # Grafana to the internet: the chart renders one router across both
            # entrypoints, and the tunnel's wildcard public hostname forwards
            # every *.henrydowd.dev name to Traefik whether or not anyone
            # configured a route for it (verified 2026-09-03 — an unused name
            # returns Traefik's own 404 through the Cloudflare edge, not
            # Cloudflare's).
            hosts:
              - grafana.lan
            path: /
            pathType: Prefix
          # The OIDC client secret as a FILE, not an env var: grafana.ini's
          # $__file{} indirection reads it at startup, so the plaintext never
          # appears in `kubectl describe pod`. Same reasoning as the
          # AUTHELIA_*_FILE env vars in k8s/apps/authelia/deployment.yaml.
          # The Secret is minted and sealed by
          # k8s/apps/authelia/new-oidc-client.sh and lives at
          # k8s/apps/monitoring/grafana-oidc-secret.sealed.yaml.
          extraSecretMounts:
            - name: grafana-oidc
              secretName: grafana-oidc
              mountPath: /etc/secrets/grafana-oidc
              readOnly: true
              defaultMode: 0440
          grafana.ini:
            server:
              # Moved off http://grafana.lan for OIDC: the redirect_uri
              # registered with Authelia must match this EXACTLY, scheme
              # included, and it has to be an HTTPS origin inside the
              # henrydowd.dev cookie domain. Served by the websecure-only
              # Ingress in k8s/apps/monitoring/grafana-ingress.yaml, which is
              # LAN-only by construction — read the comment there before
              # assuming this made Grafana public, because the reasoning is
              # not the one the phase-8 plan assumed.
              #
              # grafana.lan still works and is still the break-glass path; it
              # just redirects here for generated links.
              root_url: "https://grafana.henrydowd.dev"
            security:
              disable_initial_admin_creation: false
            # SSO via Authelia. Password login is deliberately LEFT ENABLED:
            # Grafana runs on an emptyDir and is where you look when the
            # cluster is unwell, so locking its only door behind a pod that
            # might itself be the thing that is down is exactly the failure
            # ADR 018's recoverability rule exists to prevent. Set
            # disable_login_form only once OIDC has been trusted for a while.
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              client_secret: $__file{/etc/secrets/grafana-oidc/client_secret}
              scopes: "openid profile email groups"
              empty_scopes: false
              # Authelia's endpoints live under /api/oidc/, which is not the
              # path most generic_oauth examples use. Confirm against
              # https://auth.henrydowd.dev/.well-known/openid-configuration
              # after any Authelia bump rather than trusting these.
              auth_url: "https://auth.henrydowd.dev/api/oidc/authorization"
              token_url: "https://auth.henrydowd.dev/api/oidc/token"
              api_url: "https://auth.henrydowd.dev/api/oidc/userinfo"
              login_attribute_path: preferred_username
              name_attribute_path: name
              groups_attribute_path: groups
              # Authelia registers this client with require_pkce, so this is
              # not optional — without it the authorization request is
              # rejected before the user ever sees a login form.
              use_pkce: true
              # JMESPath over the `groups` claim. `admins` is the group the
              # sealed users.yml puts henry in; anyone else who ever gets an
              # account lands on Viewer rather than inheriting Admin.
              role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
              # Grafana's own accounts and Authelia's are matched on email, so
              # logging in via Authelia adopts the existing admin user instead
              # of creating a parallel one.
              oauth_allow_insecure_email_lookup: true
          plugins: []
          extraEnvVars:
            GF_INSTALL_PLUGINS: ""
            GF_PLUGINS_PREINSTALL: ""
            GF_PLUGINS_PREINSTALL_SYNC: ""
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: VictoriaMetrics
                  type: prometheus
                  access: proxy
                  url: http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc:8428
                  isDefault: true

        # Keep the chart's bundled k8s alert + recording rules, but drop the
        # groups that target control-plane components k3s doesn't expose (their
        # scrape jobs are disabled above). Otherwise we get permanent
        # KubeControllerManagerDown / KubeSchedulerDown alerts and scheduler
        # recording rules stuck on "no data".
        defaultRules:
          enabled: true          # chart default; explicit for intent
          groups:
            kubernetesSystemControllerManager:   # KubeControllerManagerDown
              enabled: false
            kubernetesSystemScheduler:           # KubeSchedulerDown
              enabled: false
            kubeScheduler:                       # scheduler recording rules (no data on k3s)
              enabled: false
            etcd:                                # etcd rules — k3s uses embedded SQLite
              enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
